<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OctaAI Agent</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
    }

    .container {
      padding: 16px;
    }

    .header {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .logo-text {
      font-size: 18px;
      font-weight: bold;
      color: #667eea;
    }

    .connection-status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #f5f5f5;
      border-radius: 6px;
      font-size: 13px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    .status-dot.connected {
      background: #4caf50;
    }

    .status-dot.disconnected {
      background: #f44336;
      animation: none;
    }

    .status-dot.connecting {
      background: #ff9800;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }

    .controls {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .control-group {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    button {
      flex: 1;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #667eea;
      color: white;
    }

    .btn-primary:hover {
      background: #5568d3;
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
    }

    .btn-secondary {
      background: #e0e0e0;
      color: #333;
    }

    .btn-secondary:hover {
      background: #d0d0d0;
    }

    .btn-small {
      padding: 6px 10px;
      font-size: 12px;
    }

    .activity-log {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 8px;
      padding: 12px;
      max-height: 300px;
      overflow-y: auto;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .activity-header {
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .log-entry {
      font-size: 12px;
      padding: 6px 0;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      justify-content: space-between;
    }

    .log-entry:last-child {
      border-bottom: none;
    }

    .log-type {
      font-weight: 500;
      color: #667eea;
      min-width: 70px;
    }

    .log-message {
      color: #666;
      flex: 1;
      margin: 0 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .log-time {
      color: #999;
      font-size: 11px;
      min-width: 50px;
      text-align: right;
    }

    .log-error {
      background: #ffebee;
    }

    .log-error .log-type {
      color: #d32f2f;
    }

    .link-icon {
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      transition: background 0.2s;
    }

    .link-icon:hover {
      background: rgba(0, 0, 0, 0.1);
    }

    .empty-state {
      text-align: center;
      padding: 20px;
      color: #999;
      font-size: 13px;
    }

    .settings-link {
      text-align: center;
      padding: 8px 0;
      font-size: 12px;
    }

    .settings-link a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }

    .settings-link a:hover {
      text-decoration: underline;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header with Status -->
    <div class="header">
      <div class="logo">
        <span class="logo-text">OctaAI</span>
      </div>
      <div class="connection-status">
        <div class="status-dot disconnected" id="statusDot"></div>
        <span id="statusText">Disconnected</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <div class="control-group">
        <button class="btn-primary" id="connectBtn">Connect</button>
        <button class="btn-secondary btn-small" id="settingsBtn">Settings</button>
      </div>
      <div class="control-group">
        <button class="btn-secondary btn-small" id="refreshBtn">Refresh</button>
        <button class="btn-secondary btn-small" id="clearLogsBtn">Clear Logs</button>
      </div>
    </div>

    <!-- Activity Log -->
    <div class="activity-log">
      <div class="activity-header">
        <span>Activity</span>
        <span id="logCount" style="color: #999; font-size: 12px;">0</span>
      </div>
      <div id="activityList"></div>
    </div>

    <!-- Settings Link -->
    <div class="settings-link">
      <a href="#">Open Settings</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
