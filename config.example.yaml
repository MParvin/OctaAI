projects_root: "/home/user/Projects"

llm:
  # Provider options: "ollama", "openai", "claude"
  provider: "ollama"
  model: "qwen2.5:32b"
  base_url: "http://localhost:11434"
  # For OpenAI: set OPENAI_API_KEY env var or uncomment:
  # api_key: "sk-..."
  # For Claude: set ANTHROPIC_API_KEY env var or uncomment:
  # api_key: "sk-ant-..."
  temperature: 0.3
  max_tokens: 4096

safety:
  allow_paths:
    - "/home/user/Projects"
  # Optional HTTP host allowlist for git clone and http tool (empty = public hosts only, private IPs blocked)
  allow_http_hosts: []
  deny_commands:
    - "rm -rf /"
    - ":(){ :|:& };:"
    - "mkfs"
    - "dd"
    - "fdisk"
    - "shred"
  require_confirmation_for:
    - "apt upgrade"
    - "dnf upgrade"
    - "yum upgrade"

ssh:
  default_port: 22
  known_hosts_file: "~/.ssh/known_hosts"
  default_key_path: "~/.ssh/id_rsa"

storage:
  type: "sqlite"
  path: "~/.config/octaai/state.db"

isolation:
  enabled: false
  max_parallel: 3
  require_docker_for:
    - "command"
  docker:
    enabled: false
    image: "alpine:3.19"
    network: "none"
    memory_limit: "512m"
    cpu_limit: "1.0"
    read_only_root: true

engine:
  max_loops: 50
  max_retries: 3
  enable_replan: true
  enable_parallel: true
# Experimental v2 flags (parsed only — NOT wired into the production engine yet).
# Keep these false/default unless you are developing Phase 7 integrations.
# See IMPLEMENTATION_PLAN.md Phase 3/7 and IMPLEMENTATION_LOG.md.
features:
  # UNIMPLEMENTED: HTN planner packages exist; engine still uses template planner
  use_htn_planner: false

  # UNIMPLEMENTED: DAG executor not used by engine loop
  use_dag_executor: false

  # UNIMPLEMENTED: no AG2 / AutoGen integration
  enable_ag2: false

  # UNIMPLEMENTED: memory is TF-IDF today (pkg/memory/semantic.go), not a vector DB
  use_vector_memory: false

  # PARTIAL: capability registry exists; engine does not read this flag
  use_capabilities: false

  # UNIMPLEMENTED: no MCP client/server
  enable_mcp: false

  # UNIMPLEMENTED: use engine.enable_replan for v1 replanning
  enable_adaptive_replan: false

  # UNIMPLEMENTED: no reflection loop
  enable_reflection: false

browser:
  enabled: false
  port: 8765
  # token is required when enabled; daemon generates one if empty
  token: ""
  browser_domains: []
